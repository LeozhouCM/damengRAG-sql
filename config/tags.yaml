# 角色标签：只从标题判断，按 YAML 顺序匹配，先命中先算。
# 问题/原因/办法/验证用于案例报告；概念/步骤/参考/总结用于手册和背景说明。
# 证据不是角色，是 content_type=执行计划/统计输出；这样父块不会被计划块污染。
section_roles:
  验证: '验证|测试结果|效果|优化后|对比|执行结果'
  问题: '问题|现象|背景|场景|故障|慢\s*SQL|问题\s*SQL|优化前'
  原因: '原因|根因|为什么|分析|原理|机制'
  概念: '概念|介绍|定义|概述|目标'
  办法: '优化|解决|方案|方法|改写|调整|建议|策略|思路'
  步骤: '步骤|操作|配置|流程|构造环境|造数据|模拟数据|如何'
  总结: '总结|结论|小结'

# 手册角色：手册主要提供概念、步骤、参数参考；不把“优化”硬当成案例的“办法”。
# 未命中时默认按“概念”处理，避免整本手册大量落到未分类。
manual_section_roles:
  步骤: '步骤|操作|配置|流程|如何|收集|查看|监控|启用|设置|创建|删除|修改|使用'
  参考: '参考|附录|参数|语法|命令|视图|表结构'
  总结: '总结|结论|小结'

# content_type：一个块只取一个最具体类型，按下面的顺序判断。
content_types:
  - "执行计划"
  - "统计输出"
  - "SQL"
  - "表格"
  - "命令"
  - "文字"

# SQL 特征：只做显式文本/正则命中，不做 SQL 类型推断。
sql_features:
  "SELECT *": '(?i)\bselect\s+\*'
  "前导模糊": '(?i)\blike\s+["'']?%'
  "函数包列": '(?i)(where|and|or)[^\n]{0,120}\b(nvl|decode|to_char|to_date|substr|ifnull|coalesce|trunc|round|cast)\s*\('
  "隐式转换": '隐式转换|隐式类型转换|类型转换'
  "连接方式": '(?i)连接方式|连接条件|\b(left|right|inner|full|hash|nest loop|merge)\s+join\b'
  "子查询": '(?i)子查询|标量子查询|\bexists\b|\bin\s*\('
  "分页": '(?i)分页|\brownum\b|\blimit\b|\boffset\b'
  "排序": '(?i)排序|\border\s+by\b|\bsort\b'
  "绑定变量": '(?i)绑定变量|绑定参数|\bbind\b|\?\s*\)'
