# 本文件控制什么：1A 切块参数 + 1B 检索参数——路径、切块长度、embedding、召回深度、角色名额。
# 被谁读取：scripts/build_chunks.py（1A）；scripts/build_index.py、scripts/search.py、
#           scripts/eval_retrieval.py（1B）。
# 依据：实践计划书 §3(四) 配置与启动；§4(三) 切块规则；表41/表42 检索与评测；
#       DM-RAG 论文 §V 的 128 token 检索块与 0 重叠。
# 只放实际被代码读取的键；没有代码读取的参数不写在这里。
raw_dir: data/raw/dm_cases
doc_raw_dir: data/raw/dm_docs
interim_dir: data/interim/cleaned
processed_dir: data/processed
registry_file: data/registry/sources.json
log_dir: data/logs
source_url_prefix: "local://dm_cases/"
doc_source_url_prefix: "local://dm_docs/"

# 依据：DM-RAG 论文检索块 128 token；中文按字符近似取 200 字，上限 300 字；
# 论文 0/10/20 重叠对比以 0 最好，所以不重叠。字符数是工程换算，不是论文原话。
chunk_min_chars: 80
chunk_target_chars: 200
chunk_max_chars: 300
chunk_overlap_chars: 0

# 1B 检索参数。
# 依据：实践计划书 表41（sentence-transformers + Chroma、jieba + rank-bm25、RRF）；
# DM-RAG 论文 §V（BM25 + 向量 + RRF）；bge-base-zh-v1.5 模型卡（768 维、512 token、查询指令）；
# 角色分工沿用之前共识：角色选子块，父块只补上下文，父块不建索引、不参与排序。
retrieval:
  embedding_model: BAAI/bge-base-zh-v1.5
  device: cpu
  batch_size: 32
  max_seq_length: 512
  query_instruction: "为这个句子生成表示以用于检索相关文章："
  index_dir: data/index
  chroma_collection: dm_slow_sql_v2
  # rank-bm25 的 BM25Okapi 默认值；论文使用 BM25，但未给出 k1/b 的工程取值。
  bm25_k1: 1.5
  bm25_b: 0.75
  # 每路先取 50 个子块，再融合；工程取值，保证角色候选够用。
  recall_depth: 50
  # 每个角色先从融合候选里取 10 条，只是候选，不是最终名额。
  role_candidate_depth: 10
  # RRF 原论文常用 k=60；DM-RAG 也用 RRF 融合。
  rrf_k: 60
  # 报告提纲只强制这四类；概念/步骤作为补充，参考/总结不进强制提纲。
  report_roles: ["问题", "原因", "办法", "验证"]
  role_quotas:
    问题: 2
    原因: 3
    办法: 3
    验证: 2
  # 概念/步骤等补充角色不在报告四类里，但统计信息、操作步骤题会用到；
  # 默认最多取 2 个父块，不改报告四类的名额。依据：1A 角色表与 doc-001 统计信息章节。
  default_role_quota: 2
  # 证据不是角色，是内容类型；按报告“证据”一栏单独取。
  evidence_content_types: ["执行计划", "统计输出"]
  evidence_quota: 3
  # 父块只在选中之后补上下文：前后各 2 块，单角色最多 1,500 字。
  parent_window: 2
  parent_max_chars: 1500
  role_context_max_chars: 1500
  # 缺角色只补一次：search() 对缺失角色调用一次 root_local_recall，没有重试参数。
  # 没有角色要求时退回全局前 5 个子块。
  global_top_k: 5
